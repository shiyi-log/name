name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      OPENAI_API_KEY: ''
      CC_SWITCH_PROVIDER_ID: ''
      CC_SWITCH_DB_PATH: /tmp/name-ci-no-provider.db
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装固定依赖
        run: python -m pip install -r requirements.txt
      - name: 恢复压缩的数据快照
        run: python scripts/restore_compressed_sources.py
      - name: 检查 API 密钥与数据库敏感内容
        run: python scripts/check_secrets.py
      - name: 运行回归测试
        run: python -m unittest discover -s tests -v
      - name: 检查 JavaScript 语法和补丁格式
        run: |
          node --check app.js
          git show --format= --check HEAD
      - name: 检查本地服务和发布数据
        run: python scripts/smoke_test.py
